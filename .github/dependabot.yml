version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    ignore:
      # kit and svelte-check peers are ^5 || ^6. A grouped major to 7 fails npm ci.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      # The build toolchain moves together; separate PRs per package just
      # produce conflicting lockfiles.
      build-toolchain:
        patterns: ["vite", "@sveltejs/*", "svelte", "svelte-check", "typescript"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: monthly
