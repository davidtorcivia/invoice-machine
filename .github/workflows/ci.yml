name: CI

on:
  pull_request:
  push:
    branches:
      - main
  # Weekly run so a new advisory against the locked tree surfaces between
  # pull requests.
  schedule:
    - cron: "0 6 * * 1"

# A newer push to the same branch makes the previous run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor declared in pyproject, and a current release.
        python-version: ["3.11", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install locked dependencies
        # --frozen installs exactly uv.lock; a stale lock fails the check below
        # instead of silently resolving something CI never tested. uv is pinned
        # to the version that wrote the lock.
        run: |
          python -m pip install --upgrade pip uv==0.6.8
          uv sync --frozen --extra dev --python "$(which python)"
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"

      - name: Check the lockfile matches pyproject
        if: matrix.python-version == '3.14'
        run: uv lock --check

      - name: Verify MCP dependency
        # The SDK exposes no __version__, so check the v2 API and the spec
        # revision instead - a silent downgrade to v1 would fail here.
        run: |
          python - <<'PY'
          import importlib.metadata as md
          from mcp.server import MCPServer  # v2-only import path
          from mcp_types import LATEST_PROTOCOL_VERSION
          print("mcp", md.version("mcp"), "| spec", LATEST_PROTOCOL_VERSION)
          assert LATEST_PROTOCOL_VERSION == "2026-07-28", LATEST_PROTOCOL_VERSION
          PY

      - name: Lint
        run: ruff check invoice_machine/ tests/

      - name: Check formatting
        run: ruff format --check invoice_machine/ tests/

      - name: Type check
        # One leg only: pythonVersion is pinned in pyproject, so the result does
        # not vary with the runner's interpreter.
        if: matrix.python-version == '3.14'
        run: pyright invoice_machine/

      - name: Run tests
        run: pytest -q --cov --cov-report=term-missing --cov-report=xml --cov-fail-under=79

      - name: Upload coverage
        if: matrix.python-version == '3.14'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml
          retention-days: 7

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type/Svelte check
        run: npm run check

      - name: Build
        run: npm run build

  docker:
    # The image is how this is deployed. A broken Dockerfile, or a migration
    # that fails against a cold database, should fail here rather than at deploy.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: invoice-machine:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Boot the container and wait for health
        run: |
          docker run -d --name im-ci -p 8080:8080 \
            -e ENVIRONMENT=development \
            -e INVOICE_MACHINE_ENCRYPTION_KEY="$(python3 -c 'import secrets; print(secrets.token_hex(32))')" \
            invoice-machine:ci
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/health > /dev/null; then
              echo "healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "container never became healthy"
          exit 1

      - name: Confirm migrations reached head
        # Ask the database what revision it is at and compare it to the newest
        # revision on disk. This previously grepped the container logs for
        # "Alembic migrations completed successfully", which never reaches
        # stdout - so the step failed even against a container that had
        # migrated cleanly and was serving traffic.
        run: |
          # set -e matters: without it a failing docker exec leaves both
          # variables empty, they compare equal, and the step passes.
          set -euo pipefail

          head_rev=$(docker exec im-ci python -c "
          from alembic.config import Config
          from alembic.script import ScriptDirectory
          print(ScriptDirectory.from_config(Config('alembic.ini')).get_current_head())
          ")
          db_rev=$(docker exec im-ci python -c "
          import sqlite3
          print(sqlite3.connect('/app/data/invoice_machine.db')
                .execute('select version_num from alembic_version').fetchone()[0])
          ")

          echo "alembic head: $head_rev"
          echo "database at:  $db_rev"

          if [ -z "$head_rev" ] || [ -z "$db_rev" ]; then
            echo "could not read a revision from the container"
            exit 1
          fi
          if [ "$head_rev" != "$db_rev" ]; then
            echo "database is not at head"
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Smoke test the running app in a browser
        # A green build and svelte-check cannot see a component that renders
        # nothing or a CSP that stops the app booting. This drives the real UI.
        # Runners ship Chrome at /usr/bin/google-chrome.
        run: node frontend/tests/smoke.mjs
        env:
          BASE: http://localhost:8080

      - name: Container logs on failure
        if: failure()
        run: docker logs im-ci || true

  audit:
    runs-on: ubuntu-latest
    # Blocking: with uv.lock the result is a property of the commit. A red audit
    # means the lock needs `uv lock --upgrade`, which is a fix, not noise.
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Audit Python dependencies
        # Audits the locked tree the image ships, not a fresh resolution.
        run: |
          python -m pip install --upgrade pip pip-audit uv==0.6.8
          uv export --frozen --no-emit-project -o requirements.txt
          pip-audit --disable-pip -r requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Audit npm dependencies
        working-directory: frontend
        run: npm audit --audit-level=high
