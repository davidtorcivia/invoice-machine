name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Verify MCP dependency
        # The SDK exposes no __version__, so check the v2 API and the spec
        # revision instead - a silent downgrade to v1 would fail here.
        run: |
          python - <<'PY'
          import importlib.metadata as md
          from mcp.server import MCPServer  # v2-only import path
          from mcp_types import LATEST_PROTOCOL_VERSION
          print("mcp", md.version("mcp"), "| spec", LATEST_PROTOCOL_VERSION)
          assert LATEST_PROTOCOL_VERSION == "2026-07-28", LATEST_PROTOCOL_VERSION
          PY

      - name: Lint
        run: ruff check invoice_machine/ tests/

      - name: Run tests (with coverage gate)
        run: pytest -q --cov --cov-report=term-missing --cov-fail-under=60

  backend-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Windows portability suite
        # Native WeasyPrint rendering is covered by the Linux job and Docker
        # image; this job verifies that the rest of the app is usable without
        # GTK/Pango installed on the host.
        run: pytest -q --ignore=tests/test_pdf.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type/Svelte check
        run: npm run check

      - name: Build
        run: npm run build
