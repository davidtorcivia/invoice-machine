name: Feature request
description: Suggest something the app should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you running into
      description: Describe the situation rather than the solution. It often has a simpler fix than expected.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you have in mind
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you have tried or considered
