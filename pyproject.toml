[project]
name = "invoice-machine"
version = "0.1.0"
description = "AI-first invoicing application with MCP server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy[asyncio]>=2.0.25",
    "aiosqlite>=0.19.0",
    "alembic>=1.13.0",
    "python-dateutil>=2.8.0",
    "weasyprint>=60.1",
    "pydantic>=2.5.0",
    "python-multipart>=0.0.6",
    "jinja2>=3.1.3",
    "pydantic-settings>=2.1.0",
    "boto3>=1.34.0",
    "slowapi>=0.1.9",
    # v2 implements MCP spec 2026-07-28 (stateless core). v1.x is maintenance-only.
    "mcp>=2.0.0,<3",
    "cryptography>=42.0.0",
    "tzdata>=2025.2; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.26.0",
    "ruff>=0.1.0",
    "mcp>=2.0.0,<3",
]
stripe = [
    "stripe>=15.3.0,<16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501", "N818"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["invoice_machine"]
omit = [
    "invoice_machine/alembic/*",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
]
