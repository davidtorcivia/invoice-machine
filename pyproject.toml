[project]
name = "invoice-machine"
version = "0.3.0"
description = "AI-first invoicing application with MCP server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy>=2.0.25",
    "aiosqlite>=0.19.0",
    "alembic>=1.13.0",
    "python-dateutil>=2.8.0",
    "weasyprint>=68.0",
    "pydantic>=2.5.0",
    "python-multipart>=0.0.31",
    "jinja2>=3.1.3",
    "pydantic-settings>=2.1.0",
    "boto3>=1.34.0",
    "slowapi>=0.1.9",
    # v2 implements MCP spec 2026-07-28 (stateless core). v1.x is maintenance-only.
    "mcp>=2.0.0,<3",
    "cryptography>=48.0.1",
    # Runtime dependency for the Stripe REST calls in service/stripe_links.py.
    # It arrived transitively via mcp before; declared explicitly so the payment
    # integration cannot break on an unrelated dependency change.
    "httpx>=0.26.0",
    # zoneinfo has no bundled IANA database: it reads the host's, and falls back
    # to this package when there is none. Windows ships no tz database at all,
    # and slim container images frequently drop it, so validate_timezone() would
    # reject every valid zone and reminders would silently run in UTC. Declared
    # unconditionally rather than gated on sys_platform -- the failure is silent
    # and billing-relevant, and the package is ~500KB.
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.26.0",
    # Pinned to a minor series: ruff's formatter changes between releases, and
    # an open-ended range means a ruff release turns CI red without a commit.
    "ruff>=0.16,<0.17",
    # Pinned exactly: pyright adds diagnostics between releases, so an
    # unpinned range turns CI red without a commit. Wraps the npm package.
    "pyright==1.1.408",
    "mcp>=2.0.0,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pyright]
# Imports resolve against the active interpreter: CI installs into the runner's
# system Python, locally activate .venv or pass --pythonpath .venv/bin/python.
typeCheckingMode = "standard"
pythonVersion = "3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501", "N818"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["invoice_machine"]
concurrency = ["thread", "greenlet"]
omit = [
    "invoice_machine/alembic/*",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
]
